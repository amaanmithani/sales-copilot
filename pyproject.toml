[project]
name = "sales-copilot"
version = "0.1.0"
description = "Live sales-call copilot: streaming CPU speech-to-text plus in-call cue detection with measured latency."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Heavy runtime extras. CI never installs these (no model downloads in CI).
asr = ["faster-whisper>=1.0"]
embed = ["sentence-transformers>=3.0"]
bench = [
    "huggingface-hub>=0.23",
    "pyarrow>=15",
    "soundfile>=0.12",
    "num2words>=0.5.13",
]
mic = ["sounddevice>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
]

[project.scripts]
sales-copilot = "sales_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "sentence_transformers.*", "sklearn.*", "soundfile.*", "pyarrow.*", "huggingface_hub.*", "num2words.*", "sounddevice.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sales_copilot"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
