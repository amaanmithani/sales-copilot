name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# CI installs only the core + dev dependencies: no faster-whisper, no sentence-transformers,
# no datasets. Tests stub the ASR and the embedder, so nothing is downloaded.
env:
  HF_HUB_OFFLINE: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked --group dev
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy
      - name: README tables match committed results
        run: uv run python scripts/render_readme.py --check

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked --group dev
      - run: uv run pytest --cov --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv build
      - name: Wheel ships the playbook
        run: unzip -l dist/*.whl | grep sales_copilot/data/playbook.yaml
